name: Telegator macOS

on:
  workflow_dispatch:
    inputs:
      only_cache:
        description: 'Собрать только библиотеки и положить в кеш (первый запуск)'
        type: boolean
        default: false

jobs:

  macos:
    name: macOS
    runs-on: macos-latest

    env:
      UPLOAD_ARTIFACT: ${{ inputs.only_cache && 'false' || 'true' }}
      ONLY_CACHE: ${{ inputs.only_cache && 'true' || 'false' }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config

          # Disable spotlight.
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries.
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh skip-release silent

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete


      - name: API credentials.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "API_DEFINES=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV
            echo "Using own API credentials."
          else
            echo "API_DEFINES=-D TDESKTOP_API_TEST=ON" >> $GITHUB_ENV
            echo "WARNING: using Telegram test credentials, login will be limited."
          fi

      - name: Telegator build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME/Telegram

          ./configure.sh \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
          $API_DEFINES

          cmake --build ../out --config Debug --parallel

      - name: Package artifact.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME/out/Debug
          mkdir artifact
          cp -a Telegram.app artifact/
          cd artifact
          zip -qry ../Telegator-macos.zip Telegram.app

      - uses: actions/upload-artifact@v7
        if: env.ONLY_CACHE == 'false'
        name: Upload artifact.
        with:
          name: Telegator-macos
          path: ${{ env.REPO_NAME }}/out/Debug/Telegator-macos.zip
          retention-days: 14
